name: Build translation files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-translations:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show repository structure
        run: |
          pwd
          find . -maxdepth 4 -type f | sort

      - name: Build German translation
        run: |
          python scripts/build_translation.py \
            --input translations/de/batches \
            --output translations/de.json \
            --language de \
            --expected-batches 47 \
            --expected-exercises 873

      - name: Build Spanish translation
        run: |
          python scripts/build_translation.py \
            --input translations/es/batches \
            --output translations/es.json \
            --language es \
            --expected-batches 16 \
            --expected-exercises 873

      - name: Build French translation
        run: |
          python scripts/build_translation.py \
            --input translations/fr/batches \
            --output translations/fr.json \
            --language fr \
            --expected-batches 16 \
            --expected-exercises 873

      - name: Build Dutch translation
        run: |
          python scripts/build_translation.py \
            --input translations/nl/batches \
            --output translations/nl.json \
            --language nl \
            --expected-batches 16 \
            --expected-exercises 873

      - name: Verify generated files
        run: |
          for file in \
            translations/de.json \
            translations/es.json \
            translations/fr.json \
            translations/nl.json
          do
            if [ ! -f "$file" ]; then
              echo "Missing generated file: $file"
              exit 1
            fi

            ls -lh "$file"
          done

      - name: Commit generated translation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            translations/de.json \
            translations/es.json \
            translations/fr.json \
            translations/nl.json

          if git diff --cached --quiet; then
            echo "No generated translation changes to commit."
          else
            git commit -m "Build translation files"
            git push
          fi
